services:
  - type: web
    name: pakabots-whatsapp
    runtime: docker
    plan: starter
    region: oregon
    healthCheckPath: /health
    disk:
      name: whatsapp-auth
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: BUSINESS_NAME
        value: Pakas.mx
      - key: ADVISOR_PHONE
        sync: false
      - key: PUPPETEER_EXECUTABLE_PATH
        value: /usr/bin/chromium
      - key: BROWSER_HEADLESS
        value: true
      - key: WWEBJS_AUTH_PATH
        value: /data/.wwebjs_auth
      - key: PRINT_TERMINAL_QR
        value: false
      - key: CLEAR_CHROMIUM_LOCKS
        value: true
      - key: CONVERSATION_INACTIVITY_TIMEOUT_MINUTES
        value: 5
      - key: ENABLE_QR_SERVER
        value: true
      - key: QR_ACCESS_TOKEN
        sync: false
