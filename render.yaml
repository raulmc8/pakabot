services:
  - type: web
    name: pakabots-whatsapp
    runtime: docker
    autoDeployTrigger: commit
    plan: starter
    region: oregon
    healthCheckPath: /health
    envVars:
      - key: BUSINESS_NAME
        value: Pakas.mx
      - key: ADVISOR_PHONE
        sync: false
      - key: CATALOG_URL
        sync: false
      - key: WHATSAPP_ACCESS_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_VERIFY_TOKEN
        sync: false
      - key: WHATSAPP_APP_SECRET
        sync: false
      - key: WHATSAPP_GRAPH_API_VERSION
        value: v23.0
      - key: CONVERSATION_INACTIVITY_TIMEOUT_MINUTES
        value: 5
